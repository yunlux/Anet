name: Companion Conformance

on:
  pull_request:
    paths:
      - "mobile/**"
      - "src/anet/companion_protocol.py"
      - "tests/test_companion_protocol.py"
      - "docs/examples/companion-v1/**"
      - ".github/workflows/companion-conformance.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "src/anet/companion_protocol.py"
      - "tests/test_companion_protocol.py"
      - "docs/examples/companion-v1/**"
      - ".github/workflows/companion-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q tests/test_companion_protocol.py

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: "9.6.1"
      - run: gradle -p mobile/companion-core --no-daemon --non-interactive test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: "9.6.1"
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - run: >-
          gradle -p mobile --no-daemon --non-interactive
          :companion-app:testDebugUnitTest
          :companion-app:assembleDebug
