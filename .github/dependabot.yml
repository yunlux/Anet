version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /mobile
    schedule:
      interval: monthly

  - package-ecosystem: gradle
    directory: /mobile/companion-core
    schedule:
      interval: monthly
