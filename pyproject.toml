[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "anet-fabric"
version = "0.12.1"
description = "Transport-independent encrypted store-and-forward fabric for autonomous agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
  "agents",
  "encrypted-messaging",
  "mcp",
  "store-and-forward",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Communications",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "cryptography>=45.0",
  "defusedxml>=0.7.1,<1",
  "msgpack>=1.1",
]

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "pytest>=9.0",
  "pytest-asyncio>=1.0",
  "ruff>=0.12,<1",
  "twine>=6,<7",
  "uvicorn>=0.35,<1",
  "websockets>=16.1,<17",
]
mcp = ["mcp>=1.0"]
ahub = ["uvicorn>=0.35,<1", "websockets>=16.1,<17"]

[project.scripts]
anet = "anet.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
